name: 烟台消费券抢券
description: 京东App「烟台消费券」每日限量放出。睡前点一次「领取」抓模板，0 点自动重放，抢到/没抢到都会通知。
author: VincentCJ
homepage: https://github.com/VincentCJ/egern-coupon-sniper
icon: ticket
open_url: ''

# 参数越少越好（Egern 模块页可直接改）
compat_arguments:
  脚本地址: 'https://raw.githubusercontent.com/VincentCJ/egern-coupon-sniper/main/egern/coupon-sniper.js?v=8'
  放券时刻: '00:00:00'
  单次超时毫秒: '6000'
  重试次数: '30'
  重试间隔毫秒: '400'

compat_arguments_desc: |
  脚本地址: coupon-sniper.js 的 raw 地址
  放券时刻: 每天几点几分几秒发请求（一般 00:00:00）
  单次超时毫秒: 单次请求超时
  重试次数: 单次唤醒最多发几次（抢到/券发完会提前停）
  重试间隔毫秒: 第一次重试后的起始间隔（之后指数退避）

env_schema:
  TARGET_HMS:
    name: 放券时刻
    default_value: '00:00:00'
  TIMEOUT_MS:
    name: 超时(毫秒)
    default_value: '6000'
  MAX_ROUNDS:
    name: 最多发几次
    default_value: '30'
  RETRY_MS:
    name: 重试间隔(毫秒)
    default_value: '400'

scriptings:
  # 1) 抓包：京东App里点「领取」时，把这次请求存成模板（可以一直开着，开销很小）
  - http_request:
      name: 烟台消费券-抓包
      match: '^https?://(api\.m|api|wq|pro\.m|m|coupon|msite|func)\.jd\.com/.*'
      script_url: '{{{脚本地址}}}?v=8'
      update_interval: 300
      timeout: 20
      body_required: true
      env:
        TARGET_HMS: '{{{放券时刻}}}'

  # 2) 抢券：cron 每分钟，只在放券点附近的窗口内真正发请求
  - schedule:
      name: 烟台消费券-抢券
      cron: '* * * * *'
      script_url: '{{{脚本地址}}}?v=8'
      update_interval: 300
      timeout: 300
      env:
        TARGET_HMS: '{{{放券时刻}}}'
        TIMEOUT_MS: '{{{单次超时毫秒}}}'
        MAX_ROUNDS: '{{{重试次数}}}'
        RETRY_MS: '{{{重试间隔毫秒}}}'

  # 3) 试跑：手动点一下，立刻用当前模板发一次，验证模板还能不能用
  - generic:
      name: 烟台消费券-试跑
      script_url: '{{{脚本地址}}}?v=8'
      update_interval: 300
      timeout: 60
      env:
        SNIPE_MODE: 'manual'
        TARGET_HMS: '{{{放券时刻}}}'
        TIMEOUT_MS: '{{{单次超时毫秒}}}'

mitm:
  hostnames:
    includes:
    - api.m.jd.com
    - wq.jd.com
    - pro.m.jd.com
    - coupon.m.jd.com

http_captures:
  includes:
  - api.m.jd.com
  - wq.jd.com
  - pro.m.jd.com
  - coupon.m.jd.com