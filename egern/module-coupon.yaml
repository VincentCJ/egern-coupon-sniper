name: 烟台消费券定时抢券
description: 京东App「烟台消费券」专区每日限量放出，本模块自动抓取领券请求并在整点精确重放。需在京东App手动点一次「领取」用于抓包，之后每天自动执行。
author: local
icon: ticket
homepage: ''
open_url: ''

# 模块参数（Egern 模块页可直接改）
compat_arguments:
  # 脚本地址：填本仓库 raw 地址（安装后可在模块页面改）
  #   https://raw.githubusercontent.com/<你的账号>/<仓库名>/main/egern/coupon-sniper.js
  # 留空则用下面的默认值
  脚本地址: 'https://raw.githubusercontent.com/VincentCJ/egern-coupon-sniper/main/egern/coupon-sniper.js'
  放券时刻: '00:00:00'
  提前量毫秒: '50'
  重试次数: '40'
  重试间隔毫秒: '250'
  单次超时毫秒: '6000'
  补发模式: 'false'

compat_arguments_desc: |
  脚本地址: jd-coupon.js 的地址。Egern 会缓存脚本，填一次即可。
  放券时刻: 每天几点几分几秒发请求（京东App显示的放量时刻，一般 00:00:00）
  提前量毫秒: 提前多少毫秒发出，用网络延迟补偿，默认 50
  重试次数: 一次最多打多少发
  重试间隔毫秒: 两发之间的间隔
  单次超时毫秒: 单次请求超时
  补发模式: 设为 true 时，若当天放券时刻已过会立刻补打一次（用于白天测试）

env_schema:
  TARGET_HMS:
    name: 放券时刻
    description: 每天发请求的时刻
    default_value: '00:00:00'
  PREFIRE_MS:
    name: 提前量(毫秒)
    default_value: '50'
  MAX_ROUNDS:
    name: 重试次数
    default_value: '40'
  RETRY_MS:
    name: 重试间隔(毫秒)
    default_value: '250'
  TIMEOUT_MS:
    name: 超时(毫秒)
    default_value: '6000'
  CATCH_UP:
    name: 补发模式
    options:
    - 'false'
    - 'true'

scriptings:
  # 1) 自动抓包：你在京东App手动点一次「领取」，这里把真实请求存下来
  - http_request:
      name: 烟台消费券-自动抓包
      match: '^https?:\/\/[^/]*jd\.com\/.*'
      script_url: '{{{脚本地址}}}'
      update_interval: 31536000
      timeout: 20
      body_required: true
      env:
        TARGET_HMS: '{{{放券时刻}}}'

  # 2) 定时重放：每分钟触发一次，脚本自己判断"是不是到点了"，到点就精确等待后发出
  - schedule:
      name: 烟台消费券-定时抢券
      cron: '* * * * *'
      script_url: '{{{脚本地址}}}'
      update_interval: 31536000
      timeout: 300
      env:
        TARGET_HMS: '{{{放券时刻}}}'
        PREFIRE_MS: '{{{提前量毫秒}}}'
        MAX_ROUNDS: '{{{重试次数}}}'
        RETRY_MS: '{{{重试间隔毫秒}}}'
        TIMEOUT_MS: '{{{单次超时毫秒}}}'
        CATCH_UP: '{{{补发模式}}}'

  # 3) 状态小组件
  - generic:
      name: 烟台消费券-状态
      script_url: '{{{脚本地址}}}'
      update_interval: 31536000
      timeout: 20

widgets:
  - name: 烟台消费券-状态
    script_name: 烟台消费券-状态

mitm:
  hostnames:
    includes:
    - api.m.jd.com
    - m.jd.com
    - wq.jd.com
    - pro.m.jd.com
    - '*.jd.com'

http_captures:
  includes:
  - '*.jd.com'
